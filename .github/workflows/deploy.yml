name: docs

on:
  push:
    branches:
      - master
    paths-ignore:
      - ".vscode/**"
      - "CLAUDE.md"
      - "favicon.afdesign"
      - "CODE_OF_CONDUCT.md"
      - "README.md"
      - "deploy.ps1"
      - "LICENSE*"
      - "*.code-workspace"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  deploy:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Dependencies
        run: npm ci

      - name: Build VuePress
        run: npm run docs:build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: md_files/.vuepress/dist

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Dependencies
        run: npm ci

      - name: Build VuePress
        run: npm run docs:build

      - name: Package dist
        run: |
          cd md_files/.vuepress/dist
          zip -r ../../../dist.zip .
          cd ../../..

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body: |
            ## 变更

            发布版本 ${{ github.ref_name }}

            ### 部署

            下载 `dist.zip`，解压到 Web 服务器根目录即可。
          files: dist.zip
