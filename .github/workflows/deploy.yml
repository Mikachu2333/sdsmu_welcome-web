name: docs

on:
  push:
    branches:
      - master
    paths-ignore:
      - ".vscode/**"
      - "CLAUDE.md"
      - "favicon.afdesign"
      - "CODE_OF_CONDUCT.md"
      - "README.md"
      - "deploy.ps1"
      - "LICENSE*"
      - "*.code-workspace"
    tags:
      - "*"

permissions:
  contents: write

jobs:
  deploy:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Dependencies
        run: npm ci

      - name: Build VuePress
        run: npm run docs:build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: md_files/.vuepress/dist

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Dependencies
        run: npm ci

      - name: Build VuePress
        run: npm run docs:build

      - name: Package dist
        run: |
          cd md_files/.vuepress/dist
          zip -r ../../../dist.zip .
          cd ../../..

      - name: Generate changelog
        id: changelog
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG_NAME="${{ github.ref_name }}"
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              BODY="## $TAG_NAME"
              BODY+=$'\n\n'
              BODY+="$(git log --oneline --no-merges $PREV_TAG..HEAD | sed 's/^/- /')"
            else
              BODY="## $TAG_NAME"
              BODY+=$'\n\n'
              BODY+="$(git log --oneline --no-merges -1 | sed 's/^/- /')"
            fi
          else
            COMMIT_MSG="$(git log -1 --pretty=format:'%s')"
            BODY="- ${COMMIT_MSG}"
          fi
          # Write body with proper multiline handling
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update AutoBuild Release
        uses: ncipollo/release-action@v1
        with:
          tag: AutoBuild
          name: "AutoBuild"
          body: ${{ steps.changelog.outputs.body }}
          artifacts: dist.zip
          allowUpdates: true
          makeLatest: true
          removeArtifacts: true
          replacesArtifacts: true
